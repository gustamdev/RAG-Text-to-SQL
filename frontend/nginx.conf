server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cabeçalhos de segurança. O CSP libera só o Google Fonts (Archivo) além da própria origem.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # A loja não expõe admin/auth/chat do backend (o /api/v1/shop/auth continua liberado: o regex ancora em /api/v1/).
    location ~ ^/api/v1/(admin|auth|chat)(/|$) {
        return 404;
    }

    # API (FastAPI) no serviço "backend". Sem buffering.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não acrescenta): o X-Forwarded-For do cliente é forjável e burlaria o limitador de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        # `expires` em vez de add_header: add_header aqui desligaria os cabeçalhos de segurança herdados do server.
        expires 1y;
        try_files $uri =404;
    }

    # SPA: qualquer rota do React Router devolve o index.html (sem cache para pegar deploys novos).
    location / {
        expires -1; # envia Cache-Control: no-cache sem add_header (ver /assets/)
        try_files $uri $uri/ /index.html;
    }
}
