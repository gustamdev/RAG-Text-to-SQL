[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gustamdev", email = "aphexragedev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "sqlglot>=30.25.0",
    "uuid-utils>=0.19.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: precisa de serviços reais (Mongo, DuckDB, OpenAI) — não roda no `pytest` padrão.",
]
addopts = "-m \"not integration\""
