# Padrão (dev): só o MongoDB. O backend e o frontend rodam na máquina (uv / npm).
#   docker compose up -d mongo
#
# Stack completa em containers (perfil "full"):
#   docker compose --profile full up --build
# Requer backend/.env com: JWT_SECRET, OPENAI_API_KEY, MAIL_BACKEND=smtp (+ SMTP_HOST, SMTP_FROM, SMTP_USER,
# SMTP_PASSWORD), OTP_PEPPER e PSEUDONYM_KEY (JWT_SECRET, OTP_PEPPER e PSEUDONYM_KEY com 32+ caracteres). O seed baixa o dataset Olist no primeiro start.
# Crie o admin: docker compose exec backend python scripts/create_admin.py voce@email.com "Seu Nome"

services:
  mongo:
    image: mongo:8
    container_name: olist-mongodb
    restart: unless-stopped
    # Só localhost: o Mongo não tem autenticação, não pode ficar exposto na rede.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    profiles: ["full"]
    build: ./backend
    container_name: olist-backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    environment:
      ENV: prod
      # Só o nginx (loja e admin), na sub-rede fixa abaixo, pode informar o IP real do cliente.
      FORWARDED_ALLOW_IPS: 172.28.0.0/16
      MONGO_URI: mongodb://mongo:27017
      MONGO_AUTOSTART: "false"
      DUCKDB_PATH: /app/data/olist.duckdb
    volumes:
      - backend_data:/app/data
    # Sem "ports": só o nginx do frontend alcança o backend (rede interna do compose).

  frontend:
    profiles: ["full"]
    build: ./frontend
    container_name: olist-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

  # Backoffice + assistente, fora da loja. Só localhost; em produção, atrás de VPN/allowlist de IP.
  # Contexto = raiz do repo: o admin importa components/ui e lib de ./frontend.
  admin:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend-admin/Dockerfile
    container_name: olist-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:8081"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mongo_data:
  backend_data:
