server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Painel interno: fora de buscadores. Em produção, exponha só em host/porta interna ou descomente a allowlist.
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Cabeçalhos de segurança só aqui no server (add_header em location desligaria os herdados). Sem fontes externas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Atrás de proxy externo com TLS (LB/Caddy/nginx de borda): $remote_addr seria o IP do proxy e todos os clientes
    # dividiriam o mesmo limite de login. Descomente com o IP/CIDR REAL do proxy (nunca 0.0.0.0/0: o cliente forjaria o IP).
    # Também troque `proxy_set_header X-Forwarded-Proto $scheme;` abaixo por `$http_x_forwarded_proto` (só com proxy confiável).
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # O painel não expõe a API da loja.
    location /api/v1/shop/ {
        return 404;
    }

    # API (FastAPI) no serviço "backend". Sem buffering: o stream SSE do assistente precisa chegar em tempo real.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não acrescenta): o X-Forwarded-For do cliente é forjável e burlaria o limitador de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Imagens do blob storage local (só leitura, vindas do backend).
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Arquivos com hash no nome: cache longo (`expires`, não add_header).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: qualquer rota do React Router devolve o index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
