server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Painel interno: fora de buscadores. Em produção, exponha só em host/porta interna ou descomente a allowlist.
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Cabeçalhos de segurança só aqui no server (add_header em location desligaria os herdados). Sem fontes externas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # O painel não expõe a API da loja.
    location /api/v1/shop/ {
        return 404;
    }

    # API (FastAPI) no serviço "backend". Sem buffering: o stream SSE do assistente precisa chegar em tempo real.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não acrescenta): o X-Forwarded-For do cliente é forjável e burlaria o limitador de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Arquivos com hash no nome: cache longo (`expires`, não add_header).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: qualquer rota do React Router devolve o index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
